version: '3.8'

services:

  rails:
    build:
      context: .
      dockerfile: ./docker/Dockerfile

    ports:
      - "3001:3000"

    # image: atlahub-chatwoot:production

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    volumes:
      - storage_data:/app/storage

    environment:
      - NODE_ENV=production
      - RAILS_ENV=production

    entrypoint: docker/entrypoints/rails.sh

    command:
      [
        "bundle",
        "exec",
        "rails",
        "s",
        "-p",
        "3000",
        "-b",
        "0.0.0.0"
      ]

    restart: always


  sidekiq:
    build:
      context: .
      dockerfile: ./docker/Dockerfile

    # image: atlahub-chatwoot:production

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    volumes:
      - storage_data:/app/storage

    environment:
      - NODE_ENV=production
      - RAILS_ENV=production

    command:
      [
        "bundle",
        "exec",
        "sidekiq",
        "-C",
        "config/sidekiq.yml"
      ]

    restart: always


  postgres:
    image: pgvector/pgvector:pg16

    restart: always

    volumes:
      - postgres_data:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}


  redis:
    image: redis:alpine

    restart: always

    command:
      [
        "sh",
        "-c",
        "redis-server --requirepass \"$REDIS_PASSWORD\""
      ]

    volumes:
      - redis_data:/data

    env_file:
      - .env


volumes:

  postgres_data:

  redis_data:

  storage_data: